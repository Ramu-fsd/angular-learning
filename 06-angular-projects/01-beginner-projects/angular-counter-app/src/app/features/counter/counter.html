<section class="counter-card">
  <h1>Angular Counter</h1>

  <p class="subtitle">Simple counter application</p>

  <div class="counter-value" aria-live="polite">{{ count() }}</div>

  <div class="button-group">
    <button
      class="btn btn-decrement"
      (click)="decrement()"
      [disabled]="count() === 0"
    >
      − Decrement
    </button>

    <button class="btn btn-increment" (click)="increment()">+ Increment</button>
  </div>

  <button class="btn btn-reset" (click)="reset()" [disabled]="count() === 0">
    Reset
  </button>
</section>
